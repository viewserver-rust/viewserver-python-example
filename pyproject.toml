[tool.poetry]
name = "viewserver-python-example"
version = "0.1.0"
description = "Example project using viewserver-python bindings"
authors = ["ViewServer Team"]
readme = "README.md"
packages = [{include = "viewserver_example", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
pandas = ">=1.5"
pyarrow = ">=12.0"
numpy = ">=1.23"

# Pre-built wheel from GitHub Releases.
# Update the URL when a new version is released.
# Find the latest at: https://github.com/viewserver-rust/viewserver-core/releases
viewserver-python = { url = "https://github.com/viewserver-rust/viewserver-core/releases/download/python-v0.1.0/viewserver_python-0.1.0-cp310-cp310-win_amd64.whl", optional = true }

[tool.poetry.extras]
viewserver = ["viewserver-python"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
