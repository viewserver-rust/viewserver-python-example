[tool.poetry]
name = "viewserver-python-example"
version = "0.1.0"
description = "Example project using viewserver-python bindings"
authors = ["ViewServer Team"]
readme = "README.md"
packages = [{include = "viewserver_example", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
pandas = ">=1.5"
pyarrow = ">=12.0"
numpy = ">=1.23"

# viewserver-python is installed separately via quickstart.bat from this
# repo's GitHub Releases. See README.md for details.

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
