[tool.poetry]
name = "viewserver-python-example"
version = "0.1.0"
description = "Example project using viewserver-python bindings"
authors = ["ViewServer Team"]
readme = "README.md"
packages = [{include = "viewserver_example", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
pandas = ">=1.5"
pyarrow = ">=12.0"
numpy = ">=1.23"

# Install viewserver-python from GitHub Packages
# To install from a local wheel instead:
#   poetry run pip install /path/to/viewserver_python-0.1.0-cp310-cp310-win_amd64.whl
viewserver-python = {version = ">=0.1.0", source = "github", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[[tool.poetry.source]]
name = "github"
url = "https://pypi.pkg.github.com/viewserver-rust/"
priority = "supplemental"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
